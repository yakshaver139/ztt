[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dc-interview"
version = "0.1.0"
description = "Simplified datacenter digital-twin — take-home interview codebase"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "numpy>=1.24",
    "pydantic>=2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]
ingest = [
    "websockets>=12",           # sync WebSocket client for the telemetry publisher
]
dev = [
    "pytest>=7",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "jobs", "db", "lib", "ingestion"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["api", "db", "ingestion", "jobs", "lib"]
